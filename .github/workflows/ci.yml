name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned bb-plugin dependencies and SDK peer types
        working-directory: bb-plugin
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts \
            @get-bb/plugin-sdk@0.6.132 \
            typescript@5.9.3 \
            @types/node@22.20.5 \
            zod@4.6.7 \
            @types/react@19.3.0 \
            @types/better-sqlite3@7.6.13 \
            better-sqlite3@12.11.1 \
            hono@4.13.18
      - name: Run deterministic commit and CI gate
        run: ./scripts/check.sh
