name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/rex-wave/bb-plugin
            ~/.cache/rex-wave/tlaplus
          key: lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bb-plugin/package.json', 'bb-plugin/package-lock.json') }}
          restore-keys: |
            lint-${{ runner.os }}-
      - name: Run lint-only and TLC formal model gates
        env:
          REX_WAVE_FETCH_TLA: "1"
        run: ./check --lint-only --with-tlc

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/rex-wave/bb-plugin
          key: test-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'bb-plugin/package.json', 'bb-plugin/package-lock.json') }}
          restore-keys: |
            test-${{ runner.os }}-
      - name: Run deterministic commit and CI gate
        run: ./check --skip-clippy
