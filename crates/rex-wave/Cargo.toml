rex-wave-rooms.workspace = true
rex-wave-board.workspace = true
rex-wave-waves.workspace = true
rex-wave-notify.workspace = true
rex-wave-mailbridge.workspace = true
rex-wave-bb.workspace = true
rex-wave-transport.workspace = true
rex-wave-mcp.workspace = true
rex-wave-tui.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true

[lints]
workspace = true
