[workspace]
resolver = "3"
members = [
    "crates/rex-kanban",
    "crates/rex-wave-api",
    "crates/rex-wave-store",
    "crates/rex-wave-runtime",
    "crates/rex-wave-rooms",
    "crates/rex-wave-board",
    "crates/rex-wave-waves",
    "crates/rex-wave-notify",
    "crates/rex-wave-mailbridge",
    "crates/rex-wave-bb",
    "crates/rex-wave-t3",
    "crates/rex-wave-transport",
    "crates/rex-wave-mcp",
    "crates/rex-wave-tui",
    "crates/rex-wave",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Versions pinned to what is already in the offline ~/.cargo cache
# (/tmp/rex-proto-rust-tui and /tmp/rex-proto-bb-mcp/rex-actor-mcp).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "net", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.18"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
sha2 = "0.10.9"
base64 = "0.22.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
tempfile = "3.24.0"
rquickjs = { version = "0.14.0", default-features = false, features = ["futures", "parallel", "array-buffer", "properties"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
clap = { version = "4.6.1", features = ["derive", "env"] }

rex-kanban = { path = "crates/rex-kanban" }
rex-wave-api = { path = "crates/rex-wave-api" }
rex-wave-store = { path = "crates/rex-wave-store" }
rex-wave-runtime = { path = "crates/rex-wave-runtime" }
rex-wave-rooms = { path = "crates/rex-wave-rooms" }
rex-wave-board = { path = "crates/rex-wave-board" }
rex-wave-waves = { path = "crates/rex-wave-waves" }
rex-wave-notify = { path = "crates/rex-wave-notify" }
rex-wave-mailbridge = { path = "crates/rex-wave-mailbridge" }
rex-wave-bb = { path = "crates/rex-wave-bb" }
rex-wave-t3 = { path = "crates/rex-wave-t3" }
rex-wave-transport = { path = "crates/rex-wave-transport" }
rex-wave-mcp = { path = "crates/rex-wave-mcp" }
rex-wave-tui = { path = "crates/rex-wave-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Event and command enums carry their payloads inline on purpose; boxing them
# would add an allocation per message.
large_enum_variant = "allow"
type_complexity = "allow"
